name: FlClash tests

on:
  push:
    paths:
      - 'Clash/FlClash.js'
      - 'Clash/rules/**'
      - 'tests/flclash.test.cjs'
      - '.github/workflows/flclash-tests.yml'
  pull_request:
    paths:
      - 'Clash/FlClash.js'
      - 'Clash/rules/**'
      - 'tests/flclash.test.cjs'
      - '.github/workflows/flclash-tests.yml'

permissions:
  contents: read

jobs:
  flclash:
    name: Validate FlClash rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run FlClash checks
        run: node --test tests/flclash.test.cjs
